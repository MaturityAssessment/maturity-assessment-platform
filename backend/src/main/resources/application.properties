spring.application.name=maturity_assessment

# Load local, ignored credentials automatically. The first location applies
# when the backend starts from backend/; the second applies from the repository root.
# OS environment variables and JVM/system properties still take precedence.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maturity-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway Configuration
# Keep false for fresh Hibernate-managed local databases. Enable only when
# deliberately upgrading a compatible legacy schema; the migrations have no V1 baseline.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
# Apply lower-version migrations when schema history is already ahead (e.g. V3 after DB was at V4+).
spring.flyway.out-of-order=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Token Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=2592000000

# Evidence Upload Configuration
app.evidence.upload-dir=uploads/evidence
app.evidence.max-file-size=52428800
app.evidence.max-request-file-size=262144000
app.evidence.allowed-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png,image/jpg,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain
spring.servlet.multipart.max-file-size=50MB
# Includes multipart metadata overhead; application validation still caps uploaded file bytes at exactly 250MB.
spring.servlet.multipart.max-request-size=251MB

# Campaign invitation email (Gmail SMTP)
# Use a Google App Password, not the Gmail account password. Email remains disabled
# until APP_MAIL_ENABLED=true so placeholder credentials are safe for local startup.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.frontend-base-url=${APP_FRONTEND_URL:http://localhost:3000/filipevm}

# IAedu model API configuration
iaedu.api.endpoint=${IAEDU_API_ENDPOINT:}
iaedu.api.channel-id=${IAEDU_API_CHANNEL_ID:}
iaedu.api.key=${IAEDU_API_KEY:}
iaedu.api.trust-all-ssl=${IAEDU_TRUST_ALL_SSL:false}

# Local LM Studio agent evaluation beta
local-agent.enabled=${LOCAL_AGENT_ENABLED:false}
local-agent.base-url=${LOCAL_AGENT_BASE_URL:http://localhost:1234/v1}
local-agent.model=${LOCAL_AGENT_MODEL:}
local-agent.api-key=${LOCAL_AGENT_API_KEY:}
local-agent.timeout-seconds=${LOCAL_AGENT_TIMEOUT_SECONDS:120}
local-agent.temperature=${LOCAL_AGENT_TEMPERATURE:0.1}
local-agent.max-output-tokens=${LOCAL_AGENT_MAX_OUTPUT_TOKENS:1800}
local-agent.max-evidence-chars=${LOCAL_AGENT_MAX_EVIDENCE_CHARS:6000}
local-agent.max-evidence-file-bytes=${LOCAL_AGENT_MAX_EVIDENCE_FILE_BYTES:5242880}
local-agent.max-prompt-chars=${LOCAL_AGENT_MAX_PROMPT_CHARS:45000}
local-agent.max-questions-per-batch=${LOCAL_AGENT_MAX_QUESTIONS_PER_BATCH:4}
